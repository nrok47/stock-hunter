<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stock Hunter — ผลวิเคราะห์ล่าสุด</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050a14;min-height:100vh;font-family:'Noto Sans Thai','Sarabun',sans-serif;
    background-image:radial-gradient(ellipse at 20% 20%,#0d1f3c,transparent 60%),
                     radial-gradient(ellipse at 80% 80%,#1a0a1f,transparent 60%)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px}
  .card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;padding:20px 22px;margin-bottom:14px;animation:fadeIn 0.4s ease}
  .card-boss{background:rgba(255,77,109,0.06);border-color:rgba(255,77,109,0.2)}
  .card-ck{background:rgba(0,212,255,0.06);border-color:rgba(0,212,255,0.2)}
  .card-ws{background:rgba(245,158,11,0.06);border-color:rgba(245,158,11,0.2)}
  .label{font-size:10px;font-family:'Share Tech Mono',monospace;letter-spacing:1.5px;margin-bottom:10px}
  .content{font-size:13.5px;line-height:1.85;color:rgba(255,255,255,0.85);
    white-space:pre-wrap;max-height:320px;overflow-y:auto}
  .spinner{width:32px;height:32px;border:2px solid rgba(255,255,255,0.1);
    border-top-color:#00d4ff;border-radius:50%;animation:spin 0.8s linear infinite}
  @media(max-width:480px){.wrap{padding:14px 12px!important}.content{font-size:13px}}
</style>
</head>
<body>
<div class="wrap" style="max-width:680px;margin:0 auto;padding:24px 18px">

  <!-- Header -->
  <div style="text-align:center;margin-bottom:24px">
    <div style="display:inline-block;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
      border-radius:8px;padding:3px 12px;font-size:10px;color:rgba(255,255,255,0.35);
      font-family:'Share Tech Mono',monospace;margin-bottom:8px;letter-spacing:2px">
      SET · STOCK HUNTER
    </div>
    <h1 style="font-size:22px;font-weight:700;color:#fff;margin-bottom:4px">🤖 ผลวิเคราะห์ล่าสุด</h1>
    <div id="meta" style="font-size:11px;color:rgba(255,255,255,0.3);font-family:'Share Tech Mono',monospace"></div>
  </div>

  <!-- Loading -->
  <div id="loading" style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 0">
    <div class="spinner"></div>
    <div style="color:rgba(255,255,255,0.35);font-size:13px">กำลังโหลดผลวิเคราะห์...</div>
  </div>

  <!-- Error -->
  <div id="error" style="display:none;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.3);
    border-radius:10px;padding:16px;text-align:center;color:#ff7777;font-size:13px"></div>

  <!-- Results -->
  <div id="results" style="display:none">
    <div class="card card-ck">
      <div class="label" style="color:#00d4ff">🔍 AGENT 1 — ชยกร · นักคัดกรองหุ้น</div>
      <div id="out-ck" class="content"></div>
    </div>
    <div class="card card-ws">
      <div class="label" style="color:#f59e0b">📰 AGENT 2 — วศรัญ · นักวิเคราะห์ข่าว</div>
      <div id="out-ws" class="content"></div>
    </div>
    <div class="card card-boss" style="border-width:1.5px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="label" style="color:#ff4d6d;margin-bottom:0">⚡ AGENT 3 — บอส ฒ · ผู้ฟันธง</div>
        <button id="copy-btn" onclick="copyBoss()" style="background:rgba(255,77,109,0.1);
          border:1px solid rgba(255,77,109,0.3);color:rgba(255,77,109,0.8);border-radius:6px;
          padding:3px 10px;font-size:11px;cursor:pointer;font-family:'Noto Sans Thai',sans-serif">
          copy
        </button>
      </div>
      <div id="out-boss" class="content"></div>
    </div>

    <div style="text-align:center;margin-top:6px;padding:8px 14px;
      background:rgba(255,77,109,0.04);border:1px solid rgba(255,77,109,0.1);
      border-radius:10px;color:rgba(255,255,255,0.2);font-size:11px">
      ⚠️ วิเคราะห์เบื้องต้นเท่านั้น ไม่ใช่คำแนะนำการลงทุน
    </div>
  </div>

  <!-- Refresh -->
  <div style="text-align:center;margin-top:20px">
    <button onclick="load()" style="background:transparent;border:1px solid rgba(255,255,255,0.1);
      color:rgba(255,255,255,0.3);border-radius:8px;padding:7px 18px;font-size:12px;
      cursor:pointer;font-family:'Noto Sans Thai',sans-serif">
      🔄 โหลดใหม่
    </button>
  </div>

</div>

<script>
const GIST_RAW = "https://gist.githubusercontent.com/nrok47/82fd61b97064c5df31452ab4ba448bdd/raw/analysis.json";

let bossText = "";

async function load(){
  document.getElementById("loading").style.display = "flex";
  document.getElementById("results").style.display  = "none";
  document.getElementById("error").style.display    = "none";
  try{
    const r = await fetch(GIST_RAW+"?t="+Date.now());
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json();
    if(!d.boss) throw new Error("ยังไม่มีผลวิเคราะห์ — รอหมออาร์มรันก่อนนะครับ 😊");

    document.getElementById("out-ck").textContent   = d.chayakorn || "-";
    document.getElementById("out-ws").textContent   = d.watsaran  || "-";
    document.getElementById("out-boss").textContent = d.boss      || "-";
    bossText = d.boss || "";

    const updated = d.updated ? new Date(d.updated).toLocaleString("th-TH",{
      day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"
    }) : "-";
    const provLabel = d.provider==="claude"?"Claude":"Gemini";
    document.getElementById("meta").textContent = `📅 ${d.date||"-"}  ·  อัปเดต ${updated}  ·  ${provLabel}`;

    document.getElementById("loading").style.display = "none";
    document.getElementById("results").style.display = "block";
  }catch(e){
    document.getElementById("loading").style.display  = "none";
    document.getElementById("error").style.display    = "block";
    document.getElementById("error").textContent      = "⚠️ "+e.message;
  }
}

function copyBoss(){
  if(!bossText) return;
  navigator.clipboard.writeText(bossText).then(()=>{
    const btn = document.getElementById("copy-btn");
    btn.textContent = "✓ copied";
    setTimeout(()=>btn.textContent="copy", 2000);
  });
}

load();
// auto-refresh ทุก 10 นาที
setInterval(load, 10*60*1000);
// refresh เมื่อ tab กลับมา focus
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
