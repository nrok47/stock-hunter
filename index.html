<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stock Hunter — ผลวิเคราะห์</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#030712;color:#f3f4f6;min-height:100vh;
    font-family:'Outfit','Noto Sans Thai',sans-serif;
    background-image:
      radial-gradient(ellipse at 10% 10%,rgba(29,78,216,.15),transparent 50%),
      radial-gradient(ellipse at 90% 90%,rgba(112,26,117,.15),transparent 50%);
    background-attachment:fixed;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
  .card{
    background:rgba(17,24,39,.6);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.05);border-radius:16px;
    padding:20px;margin-bottom:16px;animation:fadeIn .4s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .agent-label{font-size:11px;font-family:'Share Tech Mono',monospace;letter-spacing:1.5px;font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06)}
  .content{font-size:13.5px;line-height:1.85;color:rgba(255,255,255,.9);white-space:pre-wrap;max-height:500px;overflow-y:auto}
  .btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#f3f4f6;border-radius:8px;padding:7px 16px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s}
  .btn:hover{filter:brightness(1.2)}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-family:monospace;font-weight:700}
  .pill-am{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
  .pill-pm{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.25)}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center;padding:40px 20px}
</style>
</head>
<body>
<div style="max-width:820px;margin:0 auto;padding:24px 16px">

  <!-- Header -->
  <div class="card" style="background:rgba(10,25,47,.7);border-color:rgba(0,212,255,.15);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px">
    <div>
      <div style="display:inline-block;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);border-radius:8px;padding:3px 10px;font-size:10px;color:#00d4ff;font-family:'Share Tech Mono',monospace;letter-spacing:1.5px;margin-bottom:6px">STOCK HUNTER — ผลวิเคราะห์</div>
      <h1 style="font-size:20px;font-weight:700">🤖 3-Agent Stock Hunter</h1>
    </div>
    <div id="metaBar" style="font-size:11px;color:rgba(255,255,255,.4);font-family:monospace;text-align:right"></div>
  </div>

  <!-- Content -->
  <div id="content"></div>

</div>

<script>
function uColor(name=""){
  const p=["#00d4ff","#a855f7","#f59e0b","#4ade80","#f87171","#fb923c"];
  let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%p.length; return p[h];
}
function userBadge(name){
  if(!name) return "";
  const c=uColor(name);
  return `<span style="background:${c}18;border:1px solid ${c}40;border-radius:4px;padding:1px 8px;font-size:11px;font-weight:700;color:${c}">${name}</span>`;
}
function slotPill(slot){
  if(!slot) return "";
  const am=slot.includes("เช้า");
  return `<span class="pill ${am?"pill-am":"pill-pm"}">${am?"🌅 เช้า":"🌆 เย็น"}</span>`;
}

function copyText(text,btnId){
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById(btnId);
    if(!btn) return;
    const orig=btn.textContent;
    btn.textContent="✓ copied"; btn.style.color="#4ade80"; btn.style.borderColor="rgba(74,222,128,.3)";
    setTimeout(()=>{btn.textContent=orig;btn.style.color="";btn.style.borderColor="";},2000);
  });
}

function render(d){
  const time=new Date(d.ts).toLocaleString("th-TH",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
  document.getElementById("metaBar").innerHTML=`
    ${slotPill(d.slot)}
    <span style="margin-left:6px">📅 ${d.dateStr}</span><br/>
    <span>⏰ ${time}</span>
    ${d.user?`<span style="margin-left:8px">${userBadge(d.user)}</span>`:""}
  `;

  document.getElementById("content").innerHTML=`
    <!-- A3 Boss -->
    <div class="card" style="background:rgba(255,77,109,.04);border-color:rgba(255,77,109,.2)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="agent-label" style="color:#ff4d6d;margin-bottom:0;border:none;padding:0">⚡ Agent 3 — บอส ฒ · ผู้ฟันธง & จัดการความเสี่ยง</div>
        <button id="copyBoss" class="btn" onclick="copyText(bossText,'copyBoss')" style="font-size:11px;padding:4px 12px">📋 copy</button>
      </div>
      <div style="height:1px;background:rgba(255,77,109,.15);margin:10px 0"></div>
      <div class="content">${escHtml(d.boss)}</div>
    </div>

    <!-- A1 + A2 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div class="card" style="background:rgba(0,212,255,.03);border-color:rgba(0,212,255,.15)">
        <div class="agent-label" style="color:#00d4ff">🔍 Agent 1 — ชยกร · TA Screening</div>
        <div class="content" style="max-height:320px;font-size:12.5px">${escHtml(d.ck||"-")}</div>
      </div>
      <div class="card" style="background:rgba(245,158,11,.03);border-color:rgba(245,158,11,.15)">
        <div class="agent-label" style="color:#f59e0b">📰 Agent 2 — วศรัญ · Catalyst & News</div>
        <div class="content" style="max-height:320px;font-size:12.5px">${escHtml(d.ws||"-")}</div>
      </div>
    </div>

    <div style="text-align:center;font-size:11px;color:rgba(255,255,255,.2);padding:8px">
      ⚠️ เพื่อการศึกษาเท่านั้น ไม่ใช่คำแนะนำการลงทุน
    </div>
  `;
}

function escHtml(str){
  return (str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

let bossText="";

function init(){
  const hash=window.location.hash.slice(1);
  if(!hash){
    document.getElementById("content").innerHTML=`
      <div class="empty">
        <div style="font-size:48px">📊</div>
        <div style="font-size:16px;font-weight:600;color:rgba(255,255,255,.6)">ยังไม่มีผลวิเคราะห์</div>
        <div style="font-size:13px;color:rgba(255,255,255,.3);line-height:1.8">
          ให้ CK หรือหมออาร์มรันวิเคราะห์ใน Artifact<br/>
          แล้วกด <strong style="color:#00d4ff">🔗 แชร์ผลวิเคราะห์</strong><br/>
          copy URL แล้วส่งมาเปิดหน้านี้ได้เลย
        </div>
      </div>`;
    return;
  }
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(hash))));
    bossText=d.boss||"";
    render(d);
  }catch(e){
    document.getElementById("content").innerHTML=`
      <div class="empty">
        <div style="font-size:13px;color:#f87171">⚠️ URL ไม่ถูกต้อง หรือข้อมูลเสียหาย</div>
      </div>`;
  }
}

window.addEventListener("hashchange",init);
init();
</script>
</body>
</html>
