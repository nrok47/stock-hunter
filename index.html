// Fetch previous run output from Github Gist (for Memory Layer)
async function getPreviousAnalysis(gistId, ghToken) {
  try {
    const url = GIST_API(gistId);
    const headers = {};
    if (ghToken) {
      headers["Authorization"] = `Bearer ${ghToken}`;
    }
    const r = await fetch(url, { headers });
    if (!r.ok) return null;
    const d = await r.json();
    const file = d.files?.["analysis.json"];
    if (file && file.content) {
      return JSON.parse(file.content);
    }
  } catch (e) {
    console.error("Failed to load previous analysis for memory layer", e);
  }
  return null;
}

// Upload analysis outputs to Github Gist
async function saveToGist(gistId, ghToken, data){
  const r = await fetch(GIST_API(gistId),{
    method:"PATCH",
    headers:{
      "Authorization": `Bearer ${ghToken}`,
      "Content-Type": "application/json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: JSON.stringify({
      files: {
        "analysis.json": { content: JSON.stringify(data) }
      }
    }),
  });
  if(!r.ok){ 
    const d = await r.json(); 
    throw new Error(d.message || "Gist save failed"); 
  }
}

function extractSymbols(text){
  const found = [...text.matchAll(/\*\*([A-Z0-9\-\.]{2,10})\*\*/g)].map(m=>m[1]);
  return [...new Set(found)];
}

// Token-based robust parser for copy-pasting or scraped HTML text
function parseStocks(raw) {
  const tokens = raw.split(/[\s,]+/);
  const stocks = [];
  for (let i = 0; i < tokens.length; i++) {
    const token = tokens[i].toUpperCase().replace(/[^A-Z0-9\-\.]/g, "");
    if (/^[A-Z0-9\-\.]{2,10}$/.test(token) && !/^[0-9.]+$/.test(token)) {
      if (i + 1 < tokens.length) {
        const nextVal = tokens[i+1].replace(/[^\d.]/g, "");
        if (/^[0-9.]+$/.test(nextVal)) {
          stocks.push({ s: token, p: parseFloat(nextVal) });
          i++; 
        }
      }
    }
  }
  return stocks;
}

// Scrape Hoonstation via local proxy or fallback CORS proxy
async function scrapeHoonstation() {
  let html = "";
  try {
    if (window.location.protocol !== "file:") {
      const localResponse = await fetch("./proxy.php");
      if (localResponse.ok) {
        const localData = await localResponse.json();
        if (localData.contents) {
          html = localData.contents;
        }
      }
    }
  } catch (localErr) {
    console.warn("Local PHP proxy failed, trying public CORS proxy...", localErr);
  }

  // Fallback to allorigins public proxy if local proxy was unavailable or failed
  if (!html) {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.hoonstation.com/top_hagreen')}`;
    const r = await fetch(proxyUrl);
    if (!r.ok) throw new Error("CORS Proxy error");
    const data = await r.json();
    html = data.contents;
  }

  if (!html) {
    throw new Error("ดึงข้อมูลจากเว็บล้มเหลว");
  }
  
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, "text/html");
  
  const scripts = doc.querySelectorAll("script, style");
  scripts.forEach(s => s.remove());
  
  const bodyText = doc.body ? doc.body.innerText : "";
  const parsed = parseStocks(bodyText);
  
  const unique = [];
  const seen = new Set();
  const exclude = new Set(["HA", "SET", "SET50", "SET100", "MAI", "PE", "PBV", "DE", "EPS", "ROA", "ROE", "MCAP", "G1S", "G2S", "G3S", "HOON", "STATION"]);
  
  for (const item of parsed) {
    if (!seen.has(item.s) && !exclude.has(item.s) && isNaN(item.s)) {
      seen.add(item.s);
      unique.push(item);
    }
  }
  return unique;
}

async function streamGemini(apiKey, system, user, onChunk, maxTok=1200, model="gemini-2.0-flash"){
  const r = await fetch(GEMINI_STREAM(model), {
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":apiKey},
    body: JSON.stringify({
      systemInstruction:{parts:[{text:system}]},
      contents:[{role:"user",parts:[{text:user}]}],
      generationConfig:{maxOutputTokens:maxTok},
    }),
  });
  if(!r.ok){
    let msg = "HTTP "+r.status;
    try{ const d=await r.json(); msg=d.error?.message||msg; }catch{}
    throw new Error(msg);
  }
  const reader  = r.body.getReader();
  const decoder = new TextDecoder();
  let buf="", full="";
  while(true){
    const {done,value} = await reader.read();
    if(done) break;
    buf += decoder.decode(value,{stream:true});
    const lines = buf.split("\n");
    buf = lines.pop();
    for(const line of lines){
      if(!line.startsWith("data: ")) continue;
      try{
        const chunk = JSON.parse(line.slice(6));
        const txt   = chunk.candidates?.[0]?.content?.parts?.[0]?.text || "";
        full += txt;
        onChunk(full);
      }catch{}
    }
  }
  return full.trim() || "⚠️ ไม่มีผลลัพธ์";
}

async function streamClaude(apiKey, system, user, onChunk, maxTok=1200){
  const r = await fetch(CLAUDE_API, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true",
    },
    body: JSON.stringify({
      model: CLAUDE_MODEL, max_tokens: maxTok, stream: true,
      system, messages:[{role:"user",content:user}],
    }),
  });
  if(!r.ok){
    let msg = "HTTP "+r.status;
    try{ const d=await r.json(); msg=d.error?.message||msg; }catch{}
    throw new Error(msg);
  }
  const reader  = r.body.getReader();
  const decoder = new TextDecoder();
  let buf="", full="";
  while(true){
    const {done,value} = await reader.read();
    if(done) break;
    buf += decoder.decode(value,{stream:true});
    const lines = buf.split("\n");
    buf = lines.pop();
    for(const line of lines){
      if(!line.startsWith("data: ")) continue;
      const raw = line.slice(6).trim();
      if(raw==="[DONE]") continue;
      try{
        const ev = JSON.parse(raw);
        if(ev.type==="content_block_delta" && ev.delta?.type==="text_delta"){
          full += ev.delta.text;
          onChunk(full);
        }
      }catch{}
    }
  }
  return full.trim() || "⚠️ ไม่มีผลลัพธ์";
}

  function calculateCountdown(now, morning, evening) {
    const parseTime = (timeStr, baseDate) => {
      const [h, m] = timeStr.split(":").map(Number);
      const d = new Date(baseDate);
      d.setHours(h, m, 0, 0);
      return d;
    };

    const morningTimeToday = parseTime(morning, now);
    const eveningTimeToday = parseTime(evening, now);
    
    let nextRun = null;
    let slotName = "";

    if (now < morningTimeToday) {
      nextRun = morningTimeToday;
      slotName = "รอบเช้า";
    } else if (now < eveningTimeToday) {
      nextRun = eveningTimeToday;
      slotName = "รอบเย็น";
    } else {
      const tomorrow = new Date(now);
      tomorrow.setDate(tomorrow.getDate() + 1);
      nextRun = parseTime(morning, tomorrow);
      slotName = "รอบเช้าพรุ่งนี้";
    }

    const diffMs = nextRun - now;
    const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
    const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    const diffSecs = Math.floor((diffMs % (1000 * 60)) / 1000);

    const pad = (num) => String(num).padStart(2, "0");
    return `⏳ วิเคราะห์ออโต้รอบถัดไป: ${slotName} (${nextRun.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"})}) ในอีก ${pad(diffHrs)}:${pad(diffMins)}:${pad(diffSecs)}`;
  }

    setDateStr(h.dateStr);
  };

  return(
    <div style={{ maxWidth: 840, margin: "0 auto", padding: "24px 16px" }}>
      
      {/* Header Panel */}
      <div className="glass-card" style={{ display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "space-between", gap: 14, background: "rgba(10, 25, 47, 0.7)", borderColor: "rgba(0, 212, 255, 0.15)" }}>
        <div>
          <div style={{ display: "inline-block", background: "var(--primary-glow)", border: "1px solid var(--primary)", borderRadius: 8, padding: "3px 10px", fontSize: 10, color: "var(--primary)", fontFamily: "'Share Tech Mono', monospace", letterSpacing: 1.5, marginBottom: 6 }}>
            STOCK HUNTER CONTROL CENTER
          </div>
          <h1 style={{ fontSize: 24, fontWeight: 700, color: "#fff", display: "flex", alignItems: "center", gap: 8 }}>
            🤖 3-Agent Stock Hunter
          </h1>
        </div>

        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 13, color: "var(--green)", fontWeight: "bold", display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 8, height: 8, background: "#4ade80", borderRadius: "50%", display: "inline-block", animation: schedulerEnabled ? "blink 1.2s infinite" : "none" }}/>
            {schedulerEnabled ? "Scheduler Active" : "Scheduler Offline"}
          </div>
          <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "'Share Tech Mono', monospace", marginTop: 4 }}>
            SYSTEM DATE: {dateStr}
          </div>
        </div>
      </div>

      {/* Countdown Bar if Enabled */}
      {schedulerEnabled && (
        <div style={{
          background: "linear-gradient(90deg, rgba(0, 212, 255, 0.08), rgba(167, 139, 250, 0.08))",
          border: "1px solid rgba(0, 212, 255, 0.15)", borderRadius: 12, padding: "10px 16px",
          marginBottom: 16, fontSize: 12.5, fontWeight: "600", color: "#fff", display: "flex",
          justifyContent: "space-between", alignItems: "center", animation: "fadeIn 0.5s ease"
        }}>
          <span style={{ fontFamily: "monospace" }}>{nextRunText}</span>
          <span style={{ fontSize: 10, color: "var(--text-muted)" }}>เช้า: {morningTime} | เย็น: {eveningTime}</span>
        </div>
      )}

      {/* Tab Navigation */}
      <div className="tabs-nav">
        <button className={`tab-btn ${tab === "dashboard" ? "active" : ""}`} onClick={() => setTab("dashboard")}>💻 แผงวิเคราะห์</button>
        <button className={`tab-btn ${tab === "watchlist" ? "active" : ""}`} onClick={() => setTab("watchlist")}>📈 จัดการหุ้น ({watchlist.length})</button>
        <button className={`tab-btn ${tab === "inputs" ? "active" : ""}`} onClick={() => setTab("inputs")}>📰 ข้อมูลข่าวสาร & ข้อมูลเสริม</button>
        <button className={`tab-btn ${tab === "settings" ? "active" : ""}`} onClick={() => setTab("settings")}>⚙️ ตั้งค่าระบบ</button>
        <button className={`tab-btn ${tab === "history" ? "active" : ""}`} onClick={() => setTab("history")}>🕐 ประวัติย้อนหลัง</button>
      </div>

      {error && (
        <div style={{
          background: "rgba(255,77,77,0.08)", border: "1px solid rgba(255,77,77,0.3)",
          borderRadius: 10, padding: "12px 16px", marginBottom: 16, color: "#ff7777",
          fontSize: 13, fontFamily: "monospace"
        }}>⚠️ {error}</div>
      )}

      {/* ==================== TAB: DASHBOARD ==================== */}
      {tab === "dashboard" && (
        <div>
          {/* Dashboard Header actions */}
          <div className="glass-card" style={{ textAlign: "center", padding: "26px 20px" }}>
            <p style={{ color: "var(--text-secondary)", fontSize: 13, marginBottom: 16 }}>
              คัดกรองหุ้นแบบ 3 Agents (นักคัดกรอง 🔍 &rarr; นักวิเคราะห์ข่าว 📰 &rarr; ผู้ฟันธง ⚡)
              <br/>
              ระบบวิเคราะห์เฉพาะหุ้นที่เลือกเปิดทำงานในหน้า <strong>จัดการหุ้น</strong> (เปิดอยู่ {watchlist.filter(s=>s.active).length} ตัว)
            </p>

            <div style={{ display: "flex", justifyContent: "center", gap: 10 }}>
              <button className="btn btn-primary" onClick={() => runAnalysis()} disabled={running} style={{ fontSize: 14, padding: "12px 36px" }}>
                {running ? "🔄 กำลังวิเคราะห์ทีละขั้นตอน..." : done ? "🔁 เริ่มวิเคราะห์ใหม่อีกครั้ง" : "🚀 สั่งรันวิเคราะห์แบบ 3 Agents"}
              </button>
            </div>

            {/* Micro progress status */}
            {running && (
              <div style={{ marginTop: 16, display: "flex", justifyContent: "center", gap: 20, fontSize: 11, fontFamily: "monospace" }}>
                <span style={{ color: status.chayakorn==="running"?"#00d4ff":status.chayakorn==="done"?"#4ade80":"#888" }}>
                  ชยกร: {status.chayakorn==="running"?"กำลังรัน...":status.chayakorn==="done"?"เสร็จสิ้น ✓":"รอคิว"}
                </span>
                <span style={{ color: status.watsaran==="running"?"#f59e0b":status.watsaran==="done"?"#4ade80":"#888" }}>
                  วศรัญ: {status.watsaran==="running"?"กำลังรัน...":status.watsaran==="done"?"เสร็จสิ้น ✓":"รอคิว"}
                </span>
                <span style={{ color: status.boss==="running"?"#ff4d6d":status.boss==="done"?"#4ade80":"#888" }}>
                  บอส ฒ: {status.boss==="running"?"กำลังรัน...":status.boss==="done"?"เสร็จสิ้น ✓":"รอคิว"}
                </span>
              </div>
            )}

            {gistStatus && (
              <div style={{ marginTop: 12, fontSize: 11, color: gistStatus.startsWith("error") ? "#ff5555" : "var(--primary)" }}>
                {gistStatus === "saving" ? "⏳ กำลังเผยแพร่ขึ้น Github Gist..." : 
                 gistStatus === "saved" ? "✓ เผยแพร่ขึ้นเว็บสาธารณะเรียบร้อยแล้ว!" : gistStatus}
              </div>
            )}
          </div>

          {/* Results display */}
          <AgentCard ag={AGENTS.chayakorn} status={status.chayakorn} output={output.chayakorn} step={1}/>
          <AgentCard ag={AGENTS.watsaran}  status={status.watsaran}  output={output.watsaran}  step={2}/>
          <AgentCard ag={AGENTS.boss} status={status.boss} output={output.boss} step={3} onCopy={copyBoss} copied={copied}/>

          {done && (
            <div style={{ textAlign: "center", marginTop: 10, padding: "10px 14px", background: "rgba(255,77,109,0.03)", border: "1px solid rgba(255,77,109,0.1)", borderRadius: 10, color: "var(--text-muted)", fontSize: 11 }}>
              ⚠️ การประเมินและคัดกรองเบื้องต้นนี้ทำเพื่อการศึกษาประกอบการคัดกรอง ไม่ใช่การชักชวนหรือรับประกันความมั่นคงใดๆ
            </div>
          )}
        </div>

      {tab === "watchlist" && (
        <div>

          <div className="glass-card">
            <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 10, color: "#fff" }}>🌐 ดึงหุ้นยอดนิยมจาก Hoonstation</h3>
            <p style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 14 }}>
              ดึงข้อมูลหุ้นที่มีสัญญาณ Heikin Ashi เขียว เพื่อนำเข้ามาคัดเลือกต่อโดยไม่ต้องก็อปปี้วางทีละตัว
            </p>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <button className="btn btn-secondary" onClick={triggerScrape} disabled={scraping}>
                {scraping ? "⏳ กำลังเรียกข้อมูลจากเซิร์ฟเวอร์..." : "ดึงข้อมูลจาก hoonstation.com/top_hagreen"}
              </button>
              {scrapedList.length > 0 && (
                <button className="btn btn-primary" onClick={importScrapedStocks}>
                  📥 นำเข้าหุ้นทั้งหมดที่ดึงได้ ({scrapedList.length} ตัว) เข้า Watchlist
                </button>
              )}
            </div>
            {scrapeErr && (
              <div style={{ color: "#ff5555", fontSize: 11, marginTop: 8 }}>⚠️ ขออภัย: {scrapeErr} (มีข้อจำกัดเรื่อง CORS แนะนำให้ก็อปปี้หน้าเว็บมาวางเองที่แถบขวา)</div>
            )}
            
            {/* Scraped Stocks Preview */}
            {scrapedList.length > 0 && (
              <div style={{ marginTop: 14, background: "rgba(0,0,0,0.2)", padding: 12, borderRadius: 8 }}>
                <div style={{ fontSize: 11, fontWeight: "bold", color: "var(--primary)", marginBottom: 6 }}>รายชื่อหุ้นที่ดึงได้:</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                  {scrapedList.map(s => (
                    <span key={s.s} style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 4, padding: "2px 6px", fontSize: 10 }}>
                      {s.s} ฿{s.p}
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Add Stock Form */}
          <div className="glass-card">
            <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 12, color: "#fff" }}>➕ เพิ่มหุ้นเข้า Watchlist</h3>
            <form onSubmit={handleAddStock} style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 10, alignItems: "end" }}>
              <div>
                <span className="input-label">ชื่อหุ้น (Symbol)</span>
                <input type="text" required value={newSymbol} onChange={e=>setNewSymbol(e.target.value)} placeholder="เช่น TKN, MINT" className="text-field" style={{ textTransform: "uppercase" }}/>
              </div>
              <div>
                <span className="input-label">ราคาปัจจุบัน (฿)</span>
                <input type="number" step="0.01" value={newPrice} onChange={e=>setNewPrice(e.target.value)} placeholder="ราคา เช่น 4.22" className="text-field"/>
              </div>
              <div>
                <span className="input-label">กลุ่มสัญญาณ (Category)</span>
                <select value={newCategory} onChange={e=>setNewCategory(e.target.value)} className="text-field" style={{ background: "#050a14" }}>
                  <option value="G2S">🟢🟢 G2S (HA เขียว 2 แท่ง)</option>
                  <option value="G1S">🟢 G1S (HA เขียวแท่งแรก)</option>
                  <option value="G3S">⚪ G3S (กลุ่มอื่น/เฝ้าระวัง)</option>
                </select>
              </div>
              <div>
                <button type="submit" className="btn btn-primary" style={{ width: "100%", padding: "10px" }}>เพิ่มลงลิสต์</button>
              </div>
            </form>
            <div style={{ marginTop: 10 }}>
              <span className="input-label">โน้ตประเด็นพื้นฐาน / สรุปความเห็น</span>
              <input type="text" value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="เช่น ผลประกอบการฟื้นตัว, คาดรับรู้รายได้โครงการใหญ่" className="text-field"/>
            </div>
          </div>

          {/* Watchlist Table */}
          <div className="glass-card" style={{ overflowX: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <h3 style={{ fontSize: 16, fontWeight: 700, color: "#fff" }}>📋 รายการหุ้นใน Watchlist ({watchlist.length} ตัว)</h3>
              <div style={{ fontSize: 11, color: "var(--text-muted)" }}>เลือกตัวที่ต้องการเพื่อส่งเข้า AI วิเคราะห์</div>
            </div>
            
            {watchlist.length === 0 ? (
              <div style={{ padding: "30px", textAlignment: "center", color: "var(--text-muted)" }}>
                ยังไม่มีข้อมูลหุ้นใน Watchlist — ดึงข้อมูลจาก Hoonstation หรือพิมพ์เพิ่มด้านบน
              </div>
            ) : (
              <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 600 }}>
                <thead>
                  <tr style={{ borderBottom: "1px solid rgba(255,255,255,0.06)", textAlignment: "left" }}>
                    <th style={{ padding: "8px 10px", fontSize: 11, color: "var(--text-muted)" }}>เปิดวิเคราะห์</th>
                    <th style={{ padding: "8px 10px", fontSize: 11, color: "var(--text-muted)" }}>ชื่อหุ้น</th>
                    <th style={{ padding: "8px 10px", fontSize: 11, color: "var(--text-muted)" }}>ราคาปัจจุบัน</th>
                    <th style={{ padding: "8px 10px", fontSize: 11, color: "var(--text-muted)" }}>กลุ่มสัญญาณ</th>
                    <th style={{ padding: "8px 10px", fontSize: 11, color: "var(--text-muted)" }}>ประเด็นสำคัญ/พื้นฐาน</th>
                    <th style={{ padding: "8px 10px", fontSize: 11, color: "var(--text-muted)", textAlignment: "center" }}>จัดการ</th>
                  </tr>
                </thead>
                <tbody>
                  {watchlist.map((s, index) => (
                    <tr key={s.s} style={{ borderBottom: "1px solid rgba(255,255,255,0.04)", background: index%2===0?"rgba(255,255,255,0.01)":"transparent" }}>
                      <td style={{ padding: "10px" }}>
                        <input type="checkbox" checked={s.active} onChange={() => handleToggleActive(s.s)} style={{ width: 16, height: 16, cursor: "pointer" }}/>
                      </td>
                      <td style={{ padding: "10px", fontWeight: "bold", color: "#fff" }}>{s.s}</td>
                      <td style={{ padding: "10px" }}>
                        <input type="number" step="0.01" value={s.p} onChange={(e) => handlePriceChange(s.s, e.target.value)} className="text-field" style={{ width: 80, padding: "4px 6px" }}/>
                      </td>
                      <td style={{ padding: "10px" }}>
                        <select value={s.category} onChange={(e) => handleCategoryChange(s.s, e.target.value)} className="text-field" style={{ width: 110, padding: "4px 6px", fontSize: 11, background: "#050a14" }}>
                          <option value="G2S">G2S (เขียว 2)</option>
                          <option value="G1S">G1S (เขียว 1)</option>
                          <option value="G3S">G3S (อื่นๆ)</option>
                        </select>
                      </td>
                      <td style={{ padding: "10px" }}>
                        <input type="text" value={s.note || ""} onChange={(e) => handleNoteChange(s.s, e.target.value)} placeholder="ใส่ปัจจัยพื้นฐาน..." className="text-field" style={{ padding: "4px 8px" }}/>
                      </td>
                      <td style={{ padding: "10px", textAlignment: "center" }}>
                        <button onClick={() => handleRemoveStock(s.s)} style={{ background: "rgba(255,77,109,0.1)", border: "1px solid rgba(255,77,109,0.25)", color: "#ff4d6d", borderRadius: 4, padding: "3px 8px", cursor: "pointer", fontSize: 11 }}>ลบ</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      )}

      {/* ==================== TAB: INPUTS ==================== */}
      {tab === "inputs" && (
        <div>
          <div className="glass-card">
            <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 14, color: "#fff" }}>📰 ข้อมูลประกอบการวิเคราะห์รายวัน</h3>
            
            <div style={{ marginBottom: 16 }}>
              <span className="input-label">📅 วันที่วิเคราะห์ (แสดงผลในหัวเว็บ)</span>
              <input value={dateStr} onChange={e=>setDateStr(e.target.value)} className="text-field"/>
            </div>

            <div style={{ marginBottom: 16 }}>
              <span className="input-label">🔥 หุ้นที่มีการสะสมปริมาณการซื้อขายหนาแน่น (Volume Spikes)</span>
              <textarea value={volumeSpikes} onChange={e=>{ setVolumeSpikes(e.target.value); localStorage.setItem("volume_spikes", e.target.value); }} placeholder="ใส่ชื่อหุ้นย่อหรือรายละเอียดสั้นๆ เช่น&#10;TKN (Volume 250% เกินค่าเฉลี่ย 5 วัน)&#10;MINT, SYNTEC" rows={3} className="text-field"/>
            </div>

            <div>
              <span className="input-label">📰 ข่าวเศรษฐกิจและ Catalyst ประจำวัน (ข่าวในประเทศ/ต่างประเทศ)</span>
              <textarea value={marketNews} onChange={e=>{ setMarketNews(e.target.value); localStorage.setItem("market_news", e.target.value); }} placeholder="พิมพ์หรือก็อปปี้ข่าวสำคัญมาวางที่นี่ เช่น&#10;- กนง. มีมติคงอัตราดอกเบี้ยนโยบายที่ 2.50% ต่อปี&#10;- การท่องเที่ยวแห่งประเทศไทยประกาศยอดนักท่องเที่ยวจีนสะสมทะลุเป้าหมาย&#10;- หุ้นกลุ่มพัฒนาอสังหาฯ ได้อานิสงส์มาตรการลดหย่อนภาษี" rows={6} className="text-field"/>
            </div>
          </div>

          {/* Quick manual parser for copy pasting lists */}
          <div className="glass-card">
            <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 10, color: "#fff" }}>📋 นำเข้าข้อมูลหุ้นแบบด่วน (Quick Paste Parser)</h3>
            <p style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 12 }}>
              วางข้อความดิบที่มีชื่อหุ้นและราคาปะปนอยู่ (เช่น ก็อปปี้มาจากแอปหรือหน้าเว็บอื่น) ระบบจะกรองชื่อย่อหุ้นและราคาเพิ่มเข้าลิสต์ Watchlist อัตโนมัติ
            </p>
            <textarea id="quick-paste-box" placeholder="วางข้อความที่นี่ เช่น SYNTEC 1.68 AEONTS 95.25 หรือข้อความตาราง" rows={3} className="text-field" style={{ marginBottom: 10 }}/>
            <button className="btn btn-secondary" onClick={() => {
              const box = document.getElementById("quick-paste-box");
              const text = box.value;
              if(!text.trim()) return;
              const stocks = parseStocks(text);
              if(stocks.length === 0){
                alert("ไม่สามารถวิเคราะห์หาชื่อหุ้นและราคาจากข้อความนี้ได้");
                return;
              }
              const updated = [...watchlist];
              let added = 0;
              stocks.forEach(s => {
                if(!updated.some(w => w.s === s.s)){
                  updated.push({ s: s.s, p: s.p, category: "G3S", note: "นำเข้าด่วน", active: true });
                  added++;
                }
              });
              saveWatchlist(updated);
              box.value = "";
              alert(`เพิ่มหุ้นเข้า Watchlist สำเร็จ ${added} ตัว!`);
            }}>วิเคราะห์และเพิ่มเข้า Watchlist</button>
          </div>
        </div>
      )}

      {/* ==================== TAB: SETTINGS ==================== */}
      {tab === "settings" && (
        <div>
          {/* API Keys */}
          <div className="glass-card">
            <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 14, color: "#fff" }}>🔑 คีย์บริการ AI & สิทธิ์เข้าถึง</h3>
            
            <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
              {Object.entries(PROVIDERS).map(([key,p])=>(
                <button key={key} onClick={()=>switchProvider(key)} style={{
                  flex:1, padding:"10px 6px", borderRadius:8, cursor:"pointer",
                  transition:"all 0.2s", fontSize:12, fontWeight:600,
                  background: provider===key?"rgba(255,255,255,0.06)":"transparent",
                  border: provider===key?"1px solid rgba(255,255,255,0.15)":"1px solid rgba(255,255,255,0.05)",
                  color: provider===key?"#fff":"rgba(255,255,255,0.4)"}}>
                  <div>{p.label}</div>
                  <div style={{fontSize:9, color:provider===key?p.tagColor:"rgba(255,255,255,0.2)", marginTop:2}}>{p.tag}</div>
                </button>
              ))}
            </div>

            <div style={{ marginBottom: 14 }}>
              <label className="input-label">🔑 API KEY สำหรับ {prov.label.toUpperCase()}</label>
              <input type="password" value={apiKey} onChange={e=>saveKey(e.target.value)} placeholder={prov.placeholder} className="text-field"/>
              {provider === "gemini" && (
                <div style={{ fontSize: 11, color: "#4ade80", marginTop: 6, lineHeight: 1.5 }}>
                  💡 สมัครและรับ API Key ของ Gemini <strong>ฟรี 100%</strong> ได้ที่ <a href="https://aistudio.google.com/" target="_blank" style={{ color: "#00d4ff", textDecoration: "underline", fontWeight: "bold" }}>Google AI Studio</a> (รันฟรีไม่มีค่าใช้จ่ายตลอดชีพในการใช้งานทั่วไป)
                </div>
              )}
            </div>

            {provider === "gemini" && (
              <div style={{ marginBottom: 14 }}>
                <label className="input-label">🤖 เลือกโมเดล Gemini</label>
                <select value={geminiModel} onChange={e=>saveGeminiModel(e.target.value)} className="text-field" style={{ background: "#050a14" }}>
                  {GEMINI_MODELS.map(m => <option key={m} value={m}>{m}</option>)}
                </select>
              </div>
            )}

            <div style={{ borderTop: "1px solid rgba(255,255,255,0.06)", paddingTop: 14, marginTop: 14 }}>
              <label className="input-label">🐙 GITHUB PERSONAL ACCESS TOKEN (สำหรับอัปโหลดขึ้นเว็บ)</label>
              <input type="password" value={ghToken} onChange={e=>saveGhToken(e.target.value)} placeholder="ghp_..." className="text-field" style={{ marginBottom: 10 }}/>
              
              <label className="input-label">📄 GITHUB GIST ID (สำหรับเก็บหน้าแสดงผล)</label>
              <input type="text" value={gistId} onChange={e=>saveGistId(e.target.value)} placeholder="82fd61..." className="text-field"/>
            </div>

            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 14, padding: "8px 12px", borderRadius: 8, background: tokenSave ? "rgba(74,222,128,0.03)" : "rgba(255,255,255,0.01)", border: "1px solid rgba(255,255,255,0.06)" }}>
              <div>
                <div style={{ color: tokenSave ? "#4ade80" : "rgba(255,255,255,0.4)", fontSize: 12, fontWeight: 600 }}>⚡ โหมดประหยัด Token</div>
                <div style={{ color: "rgba(255,255,255,0.25)", fontSize: 10, marginTop: 2 }}>ส่งเฉพาะรหัสย่อและข่าวให้ Agent 2-3 (ลดขนาด Token ได้ 70%)</div>
              </div>
              <button onClick={toggleTokenSave} className="btn" style={{ background: tokenSave ? "rgba(74,222,128,0.12)" : "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", color: tokenSave ? "#4ade80" : "#888", borderRadius: 20, padding: "4px 14px", fontSize: 11, fontWeight: "bold" }}>
                {tokenSave ? "เปิดใช้งาน" : "ปิดใช้งาน"}
              </button>
            </div>
          </div>

          {/* Portfolio & Risk Setting */}
          <div className="glass-card">
            <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 14, color: "#fff" }}>🛡️ ตั้งค่าขนาดพอร์ต & การคุมความเสี่ยง (Position Sizing)</h3>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <div>
                <span className="input-label">ขนาดพอร์ตโฟลิโอรวม (บาท)</span>
                <input type="number" value={portfolioSize} onChange={e=>{ setPortfolioSize(Number(e.target.value)); localStorage.setItem("portfolio_size", e.target.value); }} className="text-field"/>
              </div>
              <div>
                <span className="input-label">ระดับความเสี่ยงที่รับได้ต่อไม้</span>
                <select value={riskProfile} onChange={e=>{ setRiskProfile(e.target.value); localStorage.setItem("risk_profile", e.target.value); }} className="text-field" style={{ background: "#050a14" }}>
                  <option value="low">ต่ำ (เสี่ยงขาดทุน 1.5% ต่อไม้)</option>
                  <option value="medium">ปานกลาง (เสี่ยงขาดทุน 4% ต่อไม้)</option>
                  <option value="high">สูง (เสี่ยงขาดทุน 7% ต่อไม้)</option>
                </select>
              </div>
            </div>
          </div>

          {/* Scheduler configuration */}
          <div className="glass-card">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <h3 style={{ fontSize: 16, fontWeight: 700, color: "#fff" }}>⏰ ตั้งเวลาทำภารกิจอัตโนมัติ (Scheduler)</h3>
              <button className="btn" onClick={toggleScheduler} style={{
                background: schedulerEnabled ? "rgba(74, 222, 128, 0.12)" : "rgba(255, 255, 255, 0.04)",
                borderColor: schedulerEnabled ? "rgba(74, 222, 128, 0.3)" : "rgba(255, 255, 255, 0.1)",
                color: schedulerEnabled ? "#4ade80" : "rgba(255, 255, 255, 0.4)",
                padding: "5px 16px", borderRadius: 20, fontSize: 11
              }}>
                {schedulerEnabled ? "เปิดระบบ" : "ปิดระบบ"}
              </button>
            </div>
            
            <p style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 14 }}>
              *เพื่อให้การทำงานออโต้ดำเนินไปได้ ต้องเปิดหน้าจอนี้ทิ้งไว้บนบราวเซอร์ของเครื่องคอมพิวเตอร์ที่รันระบบ
            </p>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
              <div>
                <span className="input-label">เวลาประเมินรอบเช้า (ก่อนตลาดเปิด)</span>
                <input type="time" value={morningTime} onChange={e=>saveSchedulerTimes(e.target.value, eveningTime)} className="text-field"/>
              </div>
              <div>
                <span className="input-label">เวลาประเมินรอบเย็น (หลังปิดตลาด)</span>
                <input type="time" value={eveningTime} onChange={e=>saveSchedulerTimes(morningTime, e.target.value)} className="text-field"/>
              </div>
            </div>

            {/* Scheduler Logs */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <span className="input-label" style={{ marginBottom: 0 }}>📊 บันทึกการทำงานระบบอัตโนมัติ</span>
              <button onClick={clearLogs} style={{ background: "transparent", border: "none", color: "var(--accent)", fontSize: 10, cursor: "pointer", textDecoration: "underline" }}>ล้างบันทึก</button>
            </div>
            
            <div style={{ background: "rgba(0,0,0,0.4)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 8, padding: 12, height: 160, overflowY: "auto", fontFamily: "monospace", fontSize: 11 }}>
              {schedulerLogs.length === 0 ? (
                <div style={{ color: "var(--text-muted)", padding: "10px 0" }}>ไม่มีบันทึกการวิเคราะห์อัตโนมัติในปัจจุบัน...</div>
              ) : (
                schedulerLogs.map(l => (
                  <div key={l.id} style={{ marginBottom: 4, borderBottom: "1px solid rgba(255,255,255,0.02)", paddingBottom: 4, display: "flex", gap: 8 }}>
                    <span style={{ color: "var(--text-muted)" }}>[{l.time}]</span>
                    <span style={{ 
                      color: l.type === "success" ? "#4ade80" : 
                             l.type === "error" ? "#ff5555" : 
                             l.type === "info" ? "#00d4ff" : "#fff" 
                    }}>{l.msg}</span>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}

      {/* ==================== TAB: HISTORY ==================== */}
      {tab === "history" && (
        <div className="glass-card">
          <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 14, color: "#fff" }}>🕐 บันทึกประวัติวิเคราะห์ย้อนหลัง</h3>
          {history.length === 0 ? (
            <div style={{ padding: "30px", textAlignment: "center", color: "var(--text-muted)" }}>ไม่มีประวัติบันทึกการวิเคราะห์ย้อนหลังในบราวเซอร์นี้</div>
          ) : (
            <div>
              {history.map((h) => (
                <div key={h.ts} style={{
                  background: "rgba(0, 0, 0, 0.2)", border: "1px solid rgba(255, 255, 255, 0.05)",
                  borderRadius: 12, padding: "14px 18px", marginBottom: 10, display: "flex",
                  flexDirection: "column", gap: 10
                }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontWeight: "bold", color: "var(--primary)", fontSize: 13, fontFamily: "monospace" }}>📅 รอบวันที่ {h.dateStr}</span>
                    <button onClick={() => loadFromHistory(h)} className="btn btn-secondary" style={{ padding: "4px 12px", fontSize: 11 }}>โหลดข้อมูลขึ้นมาดู</button>
                  </div>
                  <div style={{
                    fontSize: 12.5, whiteSpace: "pre-wrap", color: "rgba(255, 255, 255, 0.8)",
                    lineHeight: 1.7, maxHeight: 150, overflowY: "auto", background: "rgba(0,0,0,0.15)",
                    padding: 10, borderRadius: 8
                  }}>{h.boss}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
