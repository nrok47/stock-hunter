<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stock Hunter — 3-Agent AI วิเคราะห์หุ้น SET</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#030712;color:#f3f4f6;min-height:100vh;
    font-family:'Outfit','Noto Sans Thai',sans-serif;
    background-image:
      radial-gradient(ellipse at 10% 10%,rgba(29,78,216,.15),transparent 50%),
      radial-gradient(ellipse at 90% 90%,rgba(112,26,117,.15),transparent 50%);
    display:flex;flex-direction:column;
  }
  header{
    padding:14px 20px;
    background:rgba(10,25,47,.8);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,212,255,.15);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  .logo-tag{
    display:inline-block;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);
    border-radius:6px;padding:2px 8px;font-size:9px;color:#00d4ff;
    letter-spacing:1.5px;margin-bottom:4px;font-family:monospace;
  }
  h1{font-size:17px;font-weight:700}
  .badge{
    display:flex;align-items:center;gap:6px;font-size:11px;
    color:rgba(255,255,255,.4);font-family:monospace;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  iframe{
    flex:1;width:100%;border:none;
    min-height:calc(100vh - 60px);
  }
  .no-url{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:40px 20px;text-align:center;
  }
  .no-url h2{font-size:18px;color:rgba(255,255,255,.6)}
  .no-url p{font-size:13px;color:rgba(255,255,255,.35);line-height:1.8;max-width:400px}
  code{
    background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);
    border-radius:6px;padding:2px 8px;font-size:12px;color:#00d4ff;font-family:monospace;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo-tag">SET · STOCK HUNTER v1.0</div>
    <h1>🤖 3-Agent Stock Hunter</h1>
  </div>
  <div class="badge">
    <div class="dot"></div>
    <span>Powered by Claude AI</span>
  </div>
</header>

<!-- 
  ══════════════════════════════════════════════
  วิธีใช้: แทนที่ YOUR_ARTIFACT_URL ด้านล่าง
  ด้วย URL ที่ได้จากการ Publish Artifact ใน Claude
  ตัวอย่าง: https://claude.site/artifacts/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  ══════════════════════════════════════════════
-->
<script>
  const ARTIFACT_URL = "https://claude.ai/public/artifacts/d0ce3338-f84a-4c3c-bbe7-237f91a6244a";

  if (!ARTIFACT_URL || ARTIFACT_URL === "https://claude.ai/public/artifacts/d0ce3338-f84a-4c3c-bbe7-237f91a6244a") {
    document.body.innerHTML += `
      <div class="no-url">
        <div style="font-size:48px">🔧</div>
        <h2>ยังไม่ได้ตั้งค่า Artifact URL</h2>
        <p>
          ให้ไปที่ Claude Artifact แล้วกด <strong>Share → Publish</strong><br/>
          copy URL ที่ได้ แล้วแก้ไขในไฟล์ <code>index.html</code><br/>
          บรรทัด <code>const ARTIFACT_URL = "..."</code>
        </p>
      </div>`;
  } else {
    const iframe = document.createElement("iframe");
    iframe.src = ARTIFACT_URL;
    iframe.title = "3-Agent Stock Hunter";
    iframe.allow = "clipboard-write; clipboard-read";
    iframe.allowFullscreen = true;
    document.body.appendChild(iframe);
  }
</script>

</body>
</html>
